<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <title>Meme-generator</title>
</head>
<body onload="onInit()">

    <!-- gallery page -->
    <section class="gallery">
        <h1>this is the gallery</h1>
        <div class="gallery-contant">

        </div>
    </section>

    <!-- edit page -->
    <section class="editor">
        <h1>this is the where you edit your meme</h1>
        <div class="editor-contant">

            <input type="text" class="text-input" value="Add your text here">
            <input type="color" class="color-input" value="#ffffff">
            <button class="increase-font-btn btn">A+</button>
            <button class="decrease-font-btn btn">A-</button>

            <canvas class="meme-canvas"></canvas>

            <a 
                class="download-link"
                href="#"
                download="my-meme.jpg"
                onclick="onDownloadMeme()">
                Download
            </a>
        </div>

    </section>


    <script src="js/util.js"></script>

    <script src="js/meme-service.js"></script>
    <script src="js/meme-controller.js"></script>

    <script src="js/gallery-service.js"></script>
    <script src="js/gallery-controller.js"></script>

    <script src="js/main.js"></script>
</body>
</html>
